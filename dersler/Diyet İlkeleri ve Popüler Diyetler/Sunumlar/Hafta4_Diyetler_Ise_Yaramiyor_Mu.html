<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diyetler İşe Yaramıyor mu? — BES339</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B2320;
    --bg-deep:#1C1613;
    --bg-raise:#382E29;
    --accent:#B5563A;
    --accent-dark:#8B3F2A;
    --accent-deep:#5E2A1D;
    --cream:#F6F1E7;
    --tan:#EDE4D3;
    --tan-mute:#DDD3C4;
    --muted:#5C5248;
    --green:#4F6B52;
    --green-light:#7A9278;
    --white:#FFFFFF;
    --black:#000000;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg-deep); overflow:hidden;}
  body{
    font-family:var(--sans);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:safe center;
    padding:7vh 9vw;
    opacity:0;
    transform:translateY(24px);
    pointer-events:none;
    overflow-y:auto;
    overflow-x:hidden;
    max-height:100vh;
    box-sizing:border-box;
    transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
  }
  .slide.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .slide.leaving{
    opacity:0;
    transform:translateY(-24px);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:var(--accent);
    display:inline-block;
  }
  h1,h2,h3{ font-family:var(--serif); font-weight:450; line-height:1.05; color:var(--cream);}
  .slide-title{ font-size:clamp(28px,3.4vw,50px); font-weight:500; margin-bottom:.5em; max-width:16ch;}
  .slide-sub{ font-family:var(--sans); font-size:clamp(14px,1.15vw,17px); color:var(--tan-mute); max-width:56ch; line-height:1.55; font-weight:400;}
  .num-badge{
    position:absolute; bottom:6vh; right:9vw;
    font-family:var(--mono); font-size:13px; color:var(--muted);
  }

  /* ===== COVER ===== */
  .cover{ justify-content:center; align-items:flex-start;}
  .cover .kicker{ font-family:var(--mono); font-size:13px; letter-spacing:.12em; color:var(--tan-mute); margin-bottom:26px; text-transform:uppercase;}
  .cover h1{ font-size:clamp(44px,7vw,96px); font-weight:450; max-width:14ch; margin-bottom:22px;}
  .cover .sub{ font-family:var(--sans); font-size:clamp(15px,1.3vw,19px); color:var(--tan-mute); max-width:44ch; line-height:1.6; margin-bottom:40px;}
  .cover .byline{ font-family:var(--mono); font-size:12.5px; color:var(--accent);}
  .cover .orb{
    position:absolute; top:-10vh; right:-8vw; width:44vw; height:44vw; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--accent-dark), transparent 70%);
    opacity:.5; filter:blur(2px);
  }

  /* ===== ACT DIVIDER ===== */
  .act-slide{ align-items:flex-start; justify-content:center; background:radial-gradient(ellipse at 20% 50%, var(--bg-raise), var(--bg-deep) 70%);}
  .act-num{ font-family:var(--serif); font-style:italic; font-size:clamp(90px,13vw,190px); color:var(--accent-deep); line-height:.8; margin-bottom:6px; -webkit-text-stroke:1px var(--accent);}
  .act-label{ font-family:var(--mono); font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:18px;}
  .act-title{ font-size:clamp(34px,5vw,64px); font-weight:500; max-width:16ch; margin-bottom:16px;}
  .act-sub{ font-family:var(--serif); font-style:italic; font-size:clamp(16px,1.5vw,22px); color:var(--tan-mute); max-width:40ch;}
  .curtain{ position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:linear-gradient(90deg, var(--bg-deep) 0%, transparent 12%, transparent 88%, var(--bg-deep) 100%);}

  /* ===== body content grid ===== */
  .content-body{ display:flex; flex-direction:column; gap:26px; max-width:1400px;}
  .grid{ display:grid; gap:18px;}
  .g2{ grid-template-columns:1fr 1fr;}
  .g3{ grid-template-columns:repeat(3,1fr);}
  .g4{ grid-template-columns:repeat(4,1fr);}
  .card{
    background:var(--bg-raise);
    border:1px solid rgba(246,241,231,0.08);
    border-radius:4px;
    padding:22px 24px;
  }
  .card.on-cream{ background:var(--tan); color:var(--bg-deep);}
  .card.on-cream .card-h{ color:var(--accent-deep);}
  .card.accent{ background:var(--accent-dark); color:var(--cream);}
  .card.green{ background:var(--green); color:var(--cream);}
  .card-h{ font-family:var(--sans); font-weight:600; font-size:15px; color:var(--accent); margin-bottom:8px;}
  .card-body{ font-size:14.5px; line-height:1.55; color:var(--tan-mute);}
  .card.on-cream .card-body{ color:var(--muted);}
  .card.accent .card-body, .card.green .card-body{ color:var(--tan);}

  /* stat */
  .stat-num{ font-family:var(--serif); font-size:clamp(40px,5vw,72px); font-weight:500; color:var(--accent); line-height:1;}
  .stat-label{ font-size:13.5px; color:var(--tan-mute); margin-top:8px; line-height:1.4;}

  /* quote */
  .quote-slide blockquote{ font-family:var(--serif); font-style:italic; font-size:clamp(22px,2.6vw,38px); line-height:1.35; color:var(--cream); max-width:22ch; margin-bottom:26px;}
  .quote-cite{ font-family:var(--mono); font-size:12.5px; color:var(--accent);}
  .quote-note{ margin-top:20px; font-size:14.5px; color:var(--tan-mute); max-width:50ch;}
  .quote-layout{ display:flex; align-items:center; justify-content:space-between; gap:clamp(28px, 4.5vw, 64px); max-width:1050px; }
  .quote-text-col{ flex:1; max-width:620px; }
  .quote-figure{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .quote-img{ width:clamp(160px, 16vw, 220px); height:auto; max-height:46vh; object-fit:cover; border-radius:12px; border:1px solid rgba(246,241,231,0.2); box-shadow:0 14px 34px rgba(0,0,0,0.5); }
  .quote-caption{ margin-top:14px; font-size:13px; line-height:1.45; color:var(--tan-mute); max-width:230px; text-align:center; }
  .quote-caption-title{ font-weight:700; color:var(--cream); display:block; font-size:14px; margin-bottom:3px; }
  .quote-caption-ref{ font-family:var(--mono); font-size:11px; color:var(--accent); display:block; }

  /* cycle diagram & split transitions */
  .cycle-wrap{ position:relative; width:min(560px,60vh); height:min(560px,60vh); margin:0 auto;}
  .cycle-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:118px; height:118px; border-radius:50%; background:var(--accent-deep); border:1px solid var(--accent); display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; padding:10px;}
  .cycle-item{ position:absolute; width:190px; padding:14px 16px; background:var(--bg-raise); border:1px solid rgba(246,241,231,.1); border-radius:4px; font-size:13px; line-height:1.4; color:var(--tan-mute);}

  /* ===== SLIDE 5: BIG CENTERED CHART ===== */
  .chart-big-container{ display:flex; align-items:center; justify-content:space-between; gap:clamp(24px, 4vw, 56px); width:100%; max-width:1120px; margin:12px auto 0; }
  .chart-main-plot{ flex:1; max-width:620px; }
  .chart-y-axis-title{ font-family:var(--sans); font-size:15px; font-weight:600; color:var(--tan); margin-bottom:12px; letter-spacing:0.01em; }
  .chart-plot-stage{ display:flex; align-items:flex-end; position:relative; padding-left:22px; padding-bottom:26px; height:clamp(300px, 38vh, 380px); }
  .chart-y-axis-bar{ position:absolute; left:0; top:0; bottom:26px; width:2.5px; background:rgba(246,241,231,0.35); }
  .chart-x-axis-bar{ position:absolute; left:0; right:0; bottom:26px; height:2.5px; background:rgba(246,241,231,0.35); }
  .chart-bars-wrap{ display:flex; align-items:flex-end; gap:clamp(48px, 6vw, 90px); margin-left:clamp(24px, 3.5vw, 48px); height:calc(100% - 26px); z-index:2; }
  .chart-bar-unit{ display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .chart-pill{ width:clamp(100px, 11vw, 140px); background:linear-gradient(180deg, #1f7796 0%, #124d62 100%); border-radius:24px 24px 8px 8px; border:1.5px solid rgba(110, 200, 230, 0.4); box-shadow:0 10px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; transition:transform .25s ease, box-shadow .25s ease; }
  .chart-pill:hover{ transform:translateY(-4px); box-shadow:0 14px 34px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.4); }
  .pill-50{ height:55%; }
  .pill-80{ height:88%; }
  .pill-pct{ font-family:var(--sans); font-size:clamp(22px, 2.3vw, 28px); font-weight:700; color:#FFFFFF; letter-spacing:0.02em; text-shadow:0 2px 8px rgba(0,0,0,0.4); }
  .chart-axis-label{ font-family:var(--sans); font-size:16px; font-weight:600; color:var(--cream); margin-top:14px; }
  .chart-side-notes{ flex:0 0 340px; display:flex; flex-direction:column; gap:18px; }
  .chart-callout-card{ background:rgba(181,86,58,0.14); border:1px solid rgba(181,86,58,0.38); border-radius:12px; padding:18px 20px; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
  .chart-cite-box{ font-family:var(--mono); font-size:11px; line-height:1.55; color:var(--muted); border-left:2px solid rgba(181,86,58,0.4); padding-left:12px; }

  /* ===== SLIDE 6 & 7: SPLIT MORPH TRANSITIONS ===== */
  .split-layout{ display:flex; align-items:center; justify-content:space-between; gap:clamp(24px, 4vw, 56px); width:100%; max-width:1150px; margin:10px auto 0; }
  .split-col-left{ flex:0 0 330px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .split-col-right{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* Mini Chart */
  .mini-chart-card{ background:rgba(56,46,41,0.5); border:1px solid rgba(246,241,231,0.1); border-radius:14px; padding:20px 16px; width:100%; max-width:320px; box-shadow:0 10px 28px rgba(0,0,0,0.3); }
  .mini-chart-y-title{ font-family:var(--sans); font-size:12px; font-weight:600; color:var(--tan); margin-bottom:8px; }
  .mini-chart-plot{ display:flex; align-items:flex-end; position:relative; padding-left:12px; padding-bottom:18px; height:190px; }
  .mini-chart-y-axis{ position:absolute; left:0; top:0; bottom:18px; width:2px; background:rgba(246,241,231,0.3); }
  .mini-chart-x-axis{ position:absolute; left:0; right:0; bottom:18px; height:2px; background:rgba(246,241,231,0.3); }
  .mini-chart-bars{ display:flex; align-items:flex-end; gap:32px; margin-left:20px; height:calc(100% - 18px); z-index:2; }
  .mini-bar-unit{ display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .mini-pill{ width:58px; background:linear-gradient(180deg, #1f7796 0%, #124d62 100%); border-radius:16px 16px 6px 6px; border:1px solid rgba(110, 200, 230, 0.35); display:flex; align-items:center; justify-content:center; }
  .mini-pill-50{ height:55%; }
  .mini-pill-80{ height:88%; }
  .mini-pct{ font-family:var(--sans); font-size:14.5px; font-weight:700; color:#FFFFFF; }
  .mini-label{ font-family:var(--sans); font-size:12px; font-weight:600; color:var(--cream); margin-top:8px; }

  /* Cycle 1 (5 circular nodes + arrows) */
  .cycle1-wrap{ position:relative; width:480px; height:480px; flex-shrink:0; }
  .cycle1-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .c1-node{ position:absolute; transform:translate(-50%, -50%); width:114px; height:114px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #227c9c, #114c61); border:2px solid rgba(255,255,255,0.24); box-shadow:0 10px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--sans); font-size:11px; font-weight:600; line-height:1.25; color:#FFFFFF; padding:10px; box-sizing:border-box; z-index:2; transition:transform .2s ease; }
  .c1-node:hover{ transform:translate(-50%, -50%) scale(1.06); }

  /* Mini Cycle 1 */
  .cycle1-mini-box{ width:310px; height:310px; position:relative; display:flex; align-items:center; justify-content:center; background:rgba(56,46,41,0.5); border:1px solid rgba(246,241,231,0.1); border-radius:14px; box-shadow:0 10px 28px rgba(0,0,0,0.3); }
  .cycle1-mini-scaler{ transform:scale(0.58); transform-origin:center center; pointer-events:none; }

  /* Cycle 2 (4 stages + thick curved arrows) */
  .cycle2-wrap{ position:relative; width:520px; height:480px; flex-shrink:0; }
  .cycle2-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .c2-stage{ position:absolute; transform:translate(-50%, -50%); font-family:var(--serif); font-size:16px; font-weight:600; line-height:1.35; color:var(--cream); text-align:center; background:var(--bg-raise); border:1px solid rgba(246,241,231,0.12); border-radius:10px; padding:12px 16px; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:2; }
  .c2-stage-top{ top:60px; left:260px; width:220px; }
  .c2-stage-right{ top:230px; left:420px; width:170px; }
  .c2-stage-bottom{ top:400px; left:260px; width:220px; }
  .c2-stage-left{ top:230px; left:100px; width:170px; }

  /* Morphing transition animations when slide becomes active */
  .slide.active .chart-morph-left{ animation: morphLeftIn .75s cubic-bezier(.16, 1, .3, 1) both; }
  .slide.active .cycle1-morph-right{ animation: morphRightIn .85s cubic-bezier(.16, 1, .3, 1) .1s both; }
  .slide.active .cycle-morph-left{ animation: morphLeftIn .75s cubic-bezier(.16, 1, .3, 1) both; }
  .slide.active .cycle2-morph-right{ animation: morphRightIn .85s cubic-bezier(.16, 1, .3, 1) .1s both; }
  @keyframes morphLeftIn{ from{ opacity:0.2; transform:translateX(120px) scale(1.1); } to{ opacity:1; transform:translateX(0) scale(1); } }
  @keyframes morphRightIn{ from{ opacity:0; transform:translateX(50px) scale(0.94); } to{ opacity:1; transform:translateX(0) scale(1); } }

  /* ===== SLIDE 8: TWO QUESTIONS WITH ILLUSTRATIONS ===== */
  .twoq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(20px, 3.5vw, 44px); max-width:1050px; width:100%; margin:14px auto 0; }
  .twoq-card{ background:var(--bg-raise); border:1px solid rgba(246,241,231,0.12); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; align-items:center; box-shadow:0 12px 32px rgba(0,0,0,0.35); }
  .twoq-card-header{ display:flex; align-items:center; gap:12px; margin-bottom:14px; width:100%; }
  .twoq-num{ font-family:var(--serif); font-size:26px; font-weight:700; color:var(--accent); width:38px; height:38px; border-radius:50%; background:rgba(181,86,58,0.18); border:1px solid rgba(181,86,58,0.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .twoq-card-title{ font-family:var(--serif); font-size:clamp(17px, 1.7vw, 22px); font-weight:500; color:var(--cream); line-height:1.25; margin:0; }
  .twoq-img-wrap{ width:100%; height:clamp(240px, 36vh, 380px); display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:10px; background:rgba(0,0,0,0.22); }
  .twoq-img-wrap img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }

  /* Table with Image Layout & Grid Figure Wrap */
  .table-img-grid{ display:flex; align-items:center; justify-content:space-between; gap:clamp(24px, 4vw, 52px); width:100%; max-width:1150px; margin-top:14px; }
  .table-col{ flex:1; min-width:320px; }
  .table-img-col{ flex:0 0 clamp(280px, 28vw, 380px); display:flex; justify-content:center; align-items:center; }
  .table-img-col img{ width:100%; max-width:380px; height:auto; max-height:clamp(440px, 60vh, 580px); object-fit:contain; border-radius:12px; border:1px solid rgba(246,241,231,0.18); box-shadow:0 14px 38px rgba(0,0,0,0.45); }
  .grid-image-wrap{ margin-top:24px; display:flex; justify-content:center; width:100%; }
  .grid-image-wrap img{ width:100%; max-width:640px; height:auto; max-height:80vh; object-fit:contain; border-radius:12px; border:1px solid rgba(246,241,231,0.18); box-shadow:0 14px 38px rgba(0,0,0,0.5); background:#ffffff; padding:14px; box-sizing:border-box; }

  /* Synth Table with Image Layout */
  .synth-img-grid{ display:flex; align-items:center; justify-content:space-between; gap:clamp(24px, 3.5vw, 48px); width:100%; max-width:1250px; }
  .synth-text-col{ flex:1 1 500px; min-width:320px; }
  .synth-img-col{ flex:1 1 520px; display:flex; justify-content:center; align-items:center; }
  .synth-img-col img{ width:100%; max-width:600px; height:auto; max-height:clamp(480px, 68vh, 700px); object-fit:contain; border-radius:12px; border:1px solid rgba(246,241,231,0.18); box-shadow:0 14px 38px rgba(0,0,0,0.5); background:#ffffff; padding:10px; box-sizing:border-box; transition:transform 0.2s ease, box-shadow 0.2s ease; }
  .synth-img-col img:hover{ transform:scale(1.02); box-shadow:0 18px 46px rgba(0,0,0,0.65); }

  /* Craving Strategy Layout */
  .craving-grid{ display:flex; align-items:center; justify-content:space-between; gap:clamp(24px, 3.5vw, 48px); width:100%; max-width:1250px; }
  .craving-text-col{ flex:1 1 480px; min-width:320px; }
  .craving-img-col{ flex:1.2 1 540px; display:flex; justify-content:center; align-items:center; }
  .craving-img-box{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .craving-img-box img{ width:100%; max-width:660px; height:auto; max-height:clamp(380px, 56vh, 520px); object-fit:contain; background:#ffffff; padding:12px; border-radius:12px; border:1px solid rgba(246,241,231,0.18); box-shadow:0 14px 38px rgba(0,0,0,0.5); box-sizing:border-box; transition:transform 0.2s ease, box-shadow 0.2s ease; }
  .craving-img-box img:hover{ transform:scale(1.02); box-shadow:0 18px 46px rgba(0,0,0,0.65); }
  .craving-caption{ font-family:var(--mono); font-size:11.5px; color:var(--tan-mute); margin-top:10px; text-align:center; line-height:1.4; max-width:620px; }
  .craving-subbullets{ list-style:none; padding-left:0; margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .craving-subbullets li{ position:relative; padding-left:18px; font-size:13.5px; color:var(--cream); line-height:1.45; }
  .craving-subbullets li::before{ content:'◦'; position:absolute; left:2px; color:var(--green-light); font-weight:700; font-size:15px; }

  @media (max-width:960px){
    .synth-img-grid, .craving-grid{ flex-direction:column; align-items:center; }
    .synth-img-col, .craving-img-col{ width:100%; max-width:600px; margin-top:20px; }
  }

  /* AI Personalized Slide Styles */
  .ai-pers-slide{ width:100%; max-width:1250px; }
  .ai-top-layout{ display:flex; flex-direction:column; gap:16px; margin-top:12px; width:100%; }
  .ai-stats-bar{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; width:100%; }
  .ai-stat-card{ padding:14px 18px; }
  .ai-graph-wrap{ width:100%; display:flex; flex-direction:column; align-items:center; margin:10px 0 16px; }
  .ai-graph-wrap img{ width:100%; max-width:960px; height:auto; max-height:clamp(380px, 55vh, 520px); object-fit:contain; background:#ffffff; padding:14px; border-radius:12px; border:1px solid rgba(246,241,231,0.18); box-shadow:0 14px 38px rgba(0,0,0,0.5); box-sizing:border-box; transition:transform 0.2s ease, box-shadow 0.2s ease; }
  .ai-graph-wrap img:hover{ transform:scale(1.015); box-shadow:0 18px 46px rgba(0,0,0,0.65); }
  .ai-graph-caption{ font-family:var(--mono); font-size:11.5px; color:var(--tan-mute); margin-top:8px; text-align:center; max-width:900px; }

  /* NAV */

  @keyframes slideInToc {

  #tocHeader {

</style>

  <div style="display:flex; flex-direction:column; gap:16px; max-width:60ch;">
  ${s.lines.map((l,i)=>`<div style="font-family:var(--serif); font-size:${i===3?'20px':'16px'}; font-style:${i>=2?'italic':'normal'}; color:${i===0?'var(--accent)':'var(--tan-mute)'}; line-height:1.5;">${l}</div>`).join('')}
  </div></div>`;
}

function renderSlide(s, idx){
  let html='';
  switch(s.type){
    case 'cover': html=renderCover(s); break;
    case 'act': html=renderAct(s); break;
    case 'choice': html=renderChoice(s); break;
    case 'quote': html=renderQuote(s); break;
    case 'chart': html=renderChart(s); break;
    case 'cycle1-split': html=renderCycle1Split(s); break;
    case 'cycle2-split': html=renderCycle2Split(s); break;
    case 'cycle': html=renderCycle1Split(s); break;
    case 'twoq': html=renderTwoQ(s); break;
    case 'icon3': html=renderIcon3(s); break;
    case 'process': html=renderProcess(s); break;
    case 'grid2': html=renderGrid(s, s.grid4?4:2); break;
    case 'grid3': html=renderGrid(s,3); break;
    case 'grid4': html=renderGrid(s,4); break;
    case 'diagram-setpoint': html=renderDiagramSetpoint(s); break;
    case 'table': html=renderTable(s); break;
    case 'statsplit': html=renderStatSplit(s); break;
    case 'grid4stat': html=renderGrid4Stat(s); break;
    case 'craving-strategy': html=renderCravingStrategy(s); break;
    case 'ai-personalized': html=renderAIPersonalized(s); break;
    case 'figure': html=renderFigureSlide(s); break;
    case 'reflection': html=renderReflectionSlide(s); break;
    case 'synth': html=renderSynth(s); break;
    case 'case-story': html=renderCaseStory(s); break;
    case 'case-backstage': html=renderCaseBackstage(s); break;
    case 'case-quote': html=renderCaseQuote(s); break;
    case 'closer': html=renderCloser(s); break;
    default: html=`<div class="slide"><div>${JSON.stringify(s)}</div></div>`;
  }
  return html;
}

/* ================= APP ================= */
const stage = document.getElementById('stage');
let current = 0;
const total = SLIDES.length;

SLIDES.forEach((s,i)=>{
  const wrap = document.createElement('div');
  wrap.innerHTML = renderSlide(s,i);
  const el = wrap.firstElementChild;
  el.dataset.idx = i;
  stage.appendChild(el);
});

const allSlideEls = Array.from(stage.children);

// build act rail
const rail = document.getElementById('act-rail') || document.getElementById('sec-rail');
const railSegs = [];
if(rail){ allSlideEls.forEach(()=>{ const seg=document.createElement('div'); seg.className='rail-seg'; rail.appendChild(seg); railSegs.push(seg); }); }

function go(idx, dir){
  if(idx<0||idx>=total) return;
  const prevEl = allSlideEls[current];
  const nextEl = allSlideEls[idx];
  if(prevEl) { prevEl.classList.remove('active'); }
  nextEl.classList.add('active');
  current = idx;
  update();
}
function update(){
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===total-1;
  const pct = ((current)/(total-1)*100)+'%';
  document.getElementById('progress-fill').style.width = pct;
  const secBar = document.getElementById('sec-bar');
  if (secBar) secBar.style.width = pct;
  const s = SLIDES[current];
  const actLabel = (s.act!==undefined) ? `PERDE ${['I','II','III','IV','V','VI','VII'][s.act]}: ${ACTS[s.act]}` : (s.type==='cover'?'GİRİŞ & KAPAK':'SONUÇ');
  document.getElementById('act-indicator').textContent = actLabel;
  const topTopic = document.getElementById('topBarTopic');
  if (topTopic) topTopic.innerHTML = `<span style="background:rgba(181,86,58,0.25); color:var(--cream); font-weight:700; padding:3px 10px; border-radius:6px;">${actLabel}</span>`;
  document.getElementById('slide-counter').textContent = (current+1)+' / '+total;
}

// TOC Drawer Controls
const tocBtn = document.getElementById('tocBtn');
const closeTocBtn = document.getElementById('closeTocBtn');
const tocModal = document.getElementById('tocModal');
const tocList = document.getElementById('tocList');

function openToc(){
  let html = "";
  let currentAct = null;
  SLIDES.forEach((s, idx) => {
    const actHeader = (s.act !== undefined) ? `PERDE ${['I','II','III','IV','V','VI','VII'][s.act]}: ${ACTS[s.act]}` : (s.type === 'cover' ? 'GİRİŞ & KAPAK' : 'SONUÇ');
    if (actHeader !== currentAct){
      currentAct = actHeader;
      html += `<div style="font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; margin:16px 0 6px; padding:5px 10px; background:rgba(181,86,58,0.15); border-radius:6px; letter-spacing:0.04em;">${currentAct}</div>`;
    }
    const isActive = current === idx;
    const title = s.title || s.q || s.h || (s.type === 'cover' ? 'Kapak Slaytı' : `Slayt ${idx + 1}`);
    const sub = s.sub || s.kicker || s.eyebrow || '';
    html += `<div class="toc-item ${isActive ? 'active' : ''}" onclick="go(${idx}); closeToc();">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div class="toc-item-title">${idx + 1}. ${title.replace(/<[^>]+>/g, ' ')}</div>
        <span style="font-size:9.5px; background:rgba(181,86,58,0.2); color:var(--cream); padding:2px 6px; border-radius:4px; font-weight:600; flex-shrink:0;">${s.type || 'slayt'}</span>
      </div>
      ${sub ? `<div class="toc-item-sub">${sub.replace(/<[^>]+>/g, ' ')}</div>` : ''}
    </div>`;
  });
  tocList.innerHTML = html;
  tocModal.classList.add('open');
  setTimeout(() => {
    const activeEl = tocList.querySelector('.toc-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function closeToc(){
  tocModal.classList.remove('open');
}

if (tocBtn) tocBtn.addEventListener('click', openToc);
if (closeTocBtn) closeTocBtn.addEventListener('click', closeToc);
if (tocModal) {
  tocModal.addEventListener('click', e => {
    if (e.target === tocModal) closeToc();
  });
}
document.getElementById('nextBtn').addEventListener('click',()=>go(current+1));
document.getElementById('prevBtn').addEventListener('click',()=>go(current-1));
window.addEventListener('keydown', e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const activeSlide = allSlideEls[current];
  const isScrollable = activeSlide && (activeSlide.scrollHeight > activeSlide.clientHeight + 15);

  if(['ArrowRight'].includes(e.key)){ e.preventDefault(); go(current+1); }
  else if(['ArrowLeft'].includes(e.key)){ e.preventDefault(); go(current-1); }
  else if(['ArrowDown'].includes(e.key)){
    if(activeSlide && isScrollable){
      activeSlide.scrollBy({ top: 130, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if(['ArrowUp'].includes(e.key)){
    if(activeSlide && isScrollable){
      activeSlide.scrollBy({ top: -130, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if(['PageDown',' '].includes(e.key)){
    if(activeSlide && isScrollable){
      const atBottom = activeSlide.scrollTop + activeSlide.clientHeight >= activeSlide.scrollHeight - 25;
      if(!atBottom){
        activeSlide.scrollBy({ top: window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current+1);
  } else if(['PageUp'].includes(e.key)){
    if(activeSlide && isScrollable){
      const atTop = activeSlide.scrollTop <= 15;
      if(!atTop){
        activeSlide.scrollBy({ top: -window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current-1);
  } else if(e.key==='Escape'){ closeToc(); }
});

// Smart Wheel & Touchpad Navigation
let isWheelLocked = false;
let wheelCooldownTimer = null;
let wheelAccumulatorX = 0;
let wheelResetTimer = null;

window.addEventListener('wheel', (e) => {
  if (document.getElementById('tocModal')?.classList.contains('open')) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

  clearTimeout(wheelResetTimer);
  wheelResetTimer = setTimeout(() => {
    wheelAccumulatorX = 0;
  }, 250);

  // Horizontal swipe / trackpad gesture (deltaX)
  if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.5) {
    if (isWheelLocked) return;
    wheelAccumulatorX += e.deltaX;
    if (wheelAccumulatorX > 60) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current + 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 550);
    } else if (wheelAccumulatorX < -60) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current - 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 550);
    }
    return;
  }

  // Vertical scroll / trackpad gestures (deltaY): Sadece slayt içeriğini kaydırır, asla slayt atlamaz
  const activeSlide = allSlideEls[current];
  if (activeSlide && Math.abs(e.deltaY) > 0) {
    activeSlide.scrollBy({ top: e.deltaY, behavior: 'auto' });
  }
}, { passive: true });

let touchX=null;
window.addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; }, { passive: true });
window.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50){ dx<0 ? go(current+1) : go(current-1); }
  touchX=null;
}, { passive: true });

go(0);
</script>

<div id="pt-root">
  <button id="pt-btn" title="Görünüm ayarları (yazı boyutu: + / − tuşları)">Aa</button>
  <div id="pt-panel">
    <h6>Yazı boyutu</h6>
    <div class="row"><button data-act="minus">A−</button><button class="sz" data-act="reset-size" title="%100'e dön">115%</button><button data-act="plus">A+</button></div>
    <h6>Yazı tipi</h6>
    <div class="row" data-group="font"><button data-v="">Orijinal</button><button data-v="modern">Modern</button><button data-v="klasik">Klasik</button><button data-v="okunakli">Okunaklı</button></div>
    <h6>Tema</h6>
    <div class="row" data-group="theme"><button data-v="">Orijinal</button><button data-v="light">Açık</button><button data-v="dark">Koyu</button><button data-v="paper">Kâğıt</button><button data-v="contrast">Kontrast</button></div>
    <h6>Renk paleti</h6>
    <div class="row" data-group="pal"><button data-v="">Orijinal</button><button data-v="70"><i class="sw" style="background:#3b82f6"></i>1</button><button data-v="150"><i class="sw" style="background:#c026d3"></i>2</button><button data-v="230"><i class="sw" style="background:#f59e0b"></i>3</button></div>
    <button class="reset" data-act="reset-all">Tümünü sıfırla</button>
  </div>
</div>
<script>
(function(){
  var KEY='gorunum-v1', S={size:1.15,font:'',theme:'',pal:''};
  try{ var j=JSON.parse(localStorage.getItem(KEY)||'{}'); for(var k in j) if(k in S) S[k]=j[k]; }catch(e){}
  var root=document.documentElement, panel=document.getElementById('pt-root');
  var bodyDark=false;
  function lum(c){ var m=c&&c.match(/[\d.]+/g); if(!m||m.length<3) return null; if(m.length>3&&parseFloat(m[3])===0) return null; return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255; }
  function detect(){
    try{
      var el=document.elementFromPoint(innerWidth/2,innerHeight/2), l=null;
      while(el&&l===null){ l=lum(getComputedStyle(el).backgroundColor); el=el.parentElement; }
      if(l===null) l=lum(getComputedStyle(document.body).backgroundColor);
      if(l!==null) bodyDark=l<0.4;
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function apply(){
    S.size=Math.round(Math.min(2,Math.max(0.7,S.size))*100)/100;
    root.style.setProperty('--punto',S.size);
    var parts=[],inv=[];
    if(S.pal){ parts.push('hue-rotate('+S.pal+'deg)'); }
    var th=S.theme, doInvert=(th==='dark'&&!bodyDark)||(th==='light'&&bodyDark);
    if(doInvert){ parts.push('invert(1) hue-rotate(180deg)'); inv.push('hue-rotate(180deg) invert(1)'); }
    if(th==='paper'){ parts.push('sepia(.32) saturate(.95) brightness(.99)'); }
    if(th==='contrast'){ parts.push('contrast(1.3) saturate(1.1)'); }
    if(S.pal){ inv.push('hue-rotate(-'+S.pal+'deg)'); }
    if(parts.length){ root.style.setProperty('--pt-f',parts.join(' ')); root.style.setProperty('--pt-fi',inv.length?inv.join(' '):'none'); }
    else { root.style.removeProperty('--pt-f'); root.style.removeProperty('--pt-fi'); }
    if(S.font) root.setAttribute('data-pt-font',S.font); else root.removeAttribute('data-pt-font');
    panel.querySelector('.sz').textContent=Math.round(S.size*100)+'%';
    ['font','theme','pal'].forEach(function(g){
      panel.querySelectorAll('[data-group="'+g+'"] button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-v')===S[g]); });
    });
    save();
  }
  panel.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; e.stopPropagation();
    var a=b.getAttribute('data-act'), g=b.parentNode.getAttribute('data-group');
    if(b.id==='pt-btn'){ panel.classList.toggle('open'); return; }
    if(a==='minus') S.size-=0.1; else if(a==='plus') S.size+=0.1; else if(a==='reset-size') S.size=1;
    else if(a==='reset-all'){ S={size:1.15,font:'',theme:'',pal:''}; }
    else if(g){ S[g]=b.getAttribute('data-v'); }
    apply();
  });
  document.addEventListener('keydown',function(e){
    var t=(e.target&&e.target.tagName)||''; if(/INPUT|TEXTAREA|SELECT/.test(t)||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='+'||e.key==='='){S.size+=0.1;apply();}
    else if(e.key==='-'||e.key==='_'){S.size-=0.1;apply();}
    else if(e.key==='0'){S.size=1;apply();}
  });
  window.addEventListener('load',function(){ setTimeout(function(){ detect(); apply(); },400); });
  apply();
})();
</script>
