<svg width="1000" height="950" viewBox="0 0 1000 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clipR3C2"><rect x="440" y="480" width="260" height="120"/></clipPath>
    <clipPath id="clipLegend"><rect x="605" y="762" width="16" height="16"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1000" height="950" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Figure 2. Depot-specific fasting remodeling: within-cohort evidence from three multi-depot rodent studies</text>
  <text x="20" y="48" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#5A5A5A">Inclusion criterion: the only three studies in the reviewed corpus that profiled ≥3 distinct adipose depots (including BAT) within the same</text>
  <text x="20" y="63" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#5A5A5A">cohort (see Section 3.2). Columns are not a head-to-head comparison — they represent different protocols, ages, and sexes. The dot rows</text>
  <text x="20" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#5A5A5A">under each header show a schematic protocol pattern, not literal hours.</text>

  <!-- ============ CORNER CELL ============ -->
  <rect x="20" y="95" width="140" height="115" rx="6" fill="#F7F8F9" stroke="#D5D9DA" stroke-width="1"/>

  <!-- ============ COLUMN HEADERS ============ -->
  <!-- Bushman -->
  <rect x="170" y="95" width="260" height="115" rx="6" fill="#2F3E46"/>
  <text x="300" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Bushman et al. (2026)</text>
  <text x="300" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E8E8E8">TRF · 10 weeks · ♀</text>
  <rect x="252" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="263" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="274" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="285" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="296" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="307" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="318" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="329" y="146" width="9" height="9" fill="#E8E8E8"/>
  <text x="300" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">Mice (C57BL/6, female, diet-induced obesity)</text>
  <text x="300" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">Aged vs. middle-aged cohort comparison</text>

  <!-- Hornsby -->
  <rect x="440" y="95" width="260" height="115" rx="6" fill="#2F3E46"/>
  <text x="570" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Hornsby et al. (2026)</text>
  <text x="570" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E8E8E8">5:2 IF · 6 weeks · ♂ ♀</text>
  <rect x="522" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="533" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="544" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="555" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="566" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="577" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="588" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="599" y="146" width="9" height="9" fill="#E8E8E8"/>
  <text x="570" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">Mice (C57BL/6 WT + GHSR-null)</text>
  <text x="570" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">Adolescent (7 wk) and adult (7 mo) cohorts</text>

  <!-- Zhang -->
  <rect x="710" y="95" width="260" height="115" rx="6" fill="#2F3E46"/>
  <text x="840" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Zhang et al. (2026)</text>
  <text x="840" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E8E8E8">ADF · 3 cycles · ♂</text>
  <rect x="792" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="803" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="814" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="825" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="836" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="847" y="146" width="9" height="9" fill="#E8E8E8"/><rect x="858" y="146" width="9" height="9" fill="#5A5A5A"/><rect x="869" y="146" width="9" height="9" fill="#E8E8E8"/>
  <text x="840" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">Mice (C57BL/6, male)</text>
  <text x="840" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#CBD5D9">3 months old, male only</text>

  <!-- ============ ROW 1: Visceral / gonadal ============ -->
  <rect x="20" y="220" width="140" height="120" rx="6" fill="#EEF1F2" stroke="#D5D9DA" stroke-width="1"/>
  <text x="90" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2F3E46">Visceral / gonadal</text>
  <text x="90" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5A5A5A">AT (gWAT/Gon-WAT)</text>

  <rect x="170" y="220" width="260" height="120" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="300" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Pparγ/Lpl/Glut4 ↑ (adipogenic)</text>
  <text x="300" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFFFFF">adipocyte diameter: unchanged</text>
  <text x="300" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#FFF6E3">(only size distribution became heterogeneous)</text>

  <rect x="440" y="220" width="260" height="120" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="570" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#2A2A2A">Gonadal + retroperitoneal</text>
  <text x="570" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2A2A2A">WAT mass unaffected</text>

  <rect x="710" y="220" width="260" height="120" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="840" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#2A2A2A">Shrinks with fasting,</text>
  <text x="840" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2A2A2A">returns to baseline on refeeding</text>
  <text x="840" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#454545">("normal cycling")</text>

  <!-- ============ ROW 2: Subcutaneous / inguinal ============ -->
  <rect x="20" y="350" width="140" height="120" rx="6" fill="#EEF1F2" stroke="#D5D9DA" stroke-width="1"/>
  <text x="90" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2F3E46">Subcutaneous / inguinal</text>
  <text x="90" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5A5A5A">AT (iWAT/Ing-WAT)</text>

  <rect x="170" y="350" width="260" height="120" fill="#009E73" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="300" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Adipocyte diameter ↓ (significant)</text>
  <text x="300" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFFFFF">Atp5b / Cpt1 (mito.) ↑↑</text>

  <rect x="440" y="350" width="260" height="120" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="570" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Mass ↑39%(♂) / ↑22%(♀)</text>
  <text x="570" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFFFFF">adipocyte size ↑17–20%</text>

  <rect x="710" y="350" width="260" height="120" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="840" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#2A2A2A">Parallel with gWAT:</text>
  <text x="840" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2A2A2A">normal fasting–refeeding cycling</text>

  <!-- ============ ROW 3: Bone marrow ============ -->
  <rect x="20" y="480" width="140" height="120" rx="6" fill="#EEF1F2" stroke="#D5D9DA" stroke-width="1"/>
  <text x="90" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2F3E46">Bone marrow</text>
  <text x="90" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5A5A5A">adipose tissue (MAT)</text>

  <rect x="170" y="480" width="260" height="120" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="300" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#2A2A2A">Not assessed in this study</text>

  <!-- Hornsby MAT: sex-divergent diagonal split -->
  <g clip-path="url(#clipR3C2)">
    <rect x="440" y="480" width="260" height="120" fill="#D55E00"/>
    <path d="M 440,480 L 700,480 L 440,600 Z" fill="#009E73"/>
  </g>
  <rect x="440" y="480" width="260" height="120" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="440" y1="600" x2="700" y2="480" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">♂ +3-fold (adol.)</text>
  <text x="500" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">/ ↑39%(adult)</text>
  <text x="630" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">♀ ↓50%(adol.) /</text>
  <text x="630" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">trend ↓37%(adult)†</text>

  <rect x="710" y="480" width="260" height="120" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="840" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#2A2A2A">Not assessed in this study</text>

  <!-- ============ ROW 4: Brown adipose ============ -->
  <rect x="20" y="610" width="140" height="120" rx="6" fill="#EEF1F2" stroke="#D5D9DA" stroke-width="1"/>
  <text x="90" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2F3E46">Brown adipose</text>
  <text x="90" y="678" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5A5A5A">tissue (BAT)</text>

  <rect x="170" y="610" width="260" height="120" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="300" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Lipid droplet regression;</text>
  <text x="300" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#FFFFFF">futile-cycling genes partially restored;</text>
  <text x="300" y="678" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#FFFFFF">Ucp1/Cidea unchanged;</text>
  <text x="300" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#FFFFFF">Errα/Atp5b (mito-biogenesis) ↓</text>

  <rect x="440" y="610" width="260" height="120" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="570" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Mass ↑37% (both sexes)</text>
  <text x="570" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFFFFF">Ucp1 mRNA ↓88%(♂) / ↓77%(♀)†</text>

  <rect x="710" y="610" width="260" height="120" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="840" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Pathological "whitening" +</text>
  <text x="840" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FFFFFF">saturated-lipid accumulation</text>
  <text x="840" y="689" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#FFEEDD">(mTORC1-dependent)</text>

  <!-- ============ LEGEND ============ -->
  <line x1="20" y1="748" x2="970" y2="748" stroke="#D5D9DA" stroke-width="1"/>

  <rect x="20" y="762" width="16" height="16" fill="#009E73"/>
  <text x="42" y="774" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">Favourable remodeling</text>
  <text x="20" y="792" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">Direction interpreted as adaptive/beneficial by the original</text>
  <text x="20" y="804" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">authors (↑ mitochondrial genes, ↑ lipolysis, droplet regression).</text>

  <rect x="215" y="762" width="16" height="16" fill="#D55E00"/>
  <text x="237" y="774" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">Adverse / pathological</text>
  <text x="215" y="792" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">Maladaptive per original authors (thermogenic</text>
  <text x="215" y="804" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">suppression, whitening, unexpected mass/gene ↑).</text>

  <rect x="410" y="762" width="16" height="16" fill="#E69F00"/>
  <text x="432" y="774" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">Partial / ambiguous</text>
  <text x="410" y="792" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">Inconsistent/partial signals within the same tissue (e.g.,</text>
  <text x="410" y="804" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">adipogenic genes ↑ but no change in adipocyte size).</text>

  <g clip-path="url(#clipLegend)">
    <rect x="605" y="762" width="16" height="16" fill="#D55E00"/>
    <path d="M 605,762 L 621,762 L 605,778 Z" fill="#009E73"/>
  </g>
  <rect x="605" y="762" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <text x="627" y="774" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">Sex-divergent (♂ / ♀)</text>
  <text x="605" y="792" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">Opposite direction by sex under the same protocol —</text>
  <text x="605" y="804" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">split diagonally (upper-left = ♂, lower-right = ♀).</text>

  <rect x="820" y="762" width="16" height="16" fill="#BDBDBD"/>
  <text x="842" y="774" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">Neutral / not measured</text>
  <text x="820" y="792" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">No significant change detected, or the parameter</text>
  <text x="820" y="804" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A5A5A">was not assessed in this study.</text>

  <text x="20" y="830" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#5A5A5A">† Reported by the original authors as a borderline or statistically non-significant trend (p&gt;0.05).</text>
</svg>
