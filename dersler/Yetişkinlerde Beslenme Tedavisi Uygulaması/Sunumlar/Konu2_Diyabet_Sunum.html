* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  background: var(--bg);
  color: var(--ink);

}

#stage {

}

}

.slide-wrapper {

.nav-btn:hover {

.tree-nav-bar {

.tree-label {

.tree-node.active-accent {

  background: var(--accent);

}

.tree-node.active-primary {
  color: #fff;
  background: var(--primary);
  box-shadow: 0 2px 6px rgba(30,90,168,0.35);
}

.tree-node.active-warning {
  color: #fff;
  background: var(--orange);
  box-shadow: 0 2px 6px rgba(217,119,6,0.35);
}

.tree-node.active-danger {

  background: var(--danger);

}

.tree-node.active-purple {

}

  display: inline-block;

.slide-title {

  letter-spacing: -0.02em;
}

.slide-sub {
  font-size: clamp(16px, 1.35vw, 22px);
  color: var(--ink-soft);

}

.grid-cols-2 {

  gap: clamp(18px, 2vw, 32px);

.grid-cols-3 {

}

@media (max-width: 900px) {

}

.card {

  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(20px, 2vw, 32px);

  flex-direction: column;
}

.card-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;

  border-radius: 6px;
  margin-bottom: 12px;

  letter-spacing: 0.04em;
}

.card-badge.primary { background: var(--primary-light); color: var(--primary); }
.card-badge.accent { background: var(--accent-light); color: var(--accent); }
.card-badge.warning { background: var(--orange-light); color: var(--orange); }
.card-badge.danger { background: var(--danger-light); color: var(--danger); }
.card-badge.purple { background: var(--purple-light); color: var(--purple); }

.card-title {

  color: var(--ink);
  margin-bottom: 12px;
  line-height: 1.25;
}

.card-body {

.card-body ul, .card-body ol { padding-left: 24px; margin-top: 8px; }

.callout-box {

  padding: clamp(16px, 1.8vh, 22px) clamp(20px, 2vw, 28px);

}

.callout-box.blue { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
.callout-box.emerald { background: var(--accent-light); border-color: var(--accent); color: #075E54; }
.callout-box.amber { background: var(--amber-light); border-color: var(--amber); color: #78350F; }
.callout-box.danger { background: var(--danger-light); border-color: var(--danger); color: #7B341E; }
.callout-box.purple { background: var(--purple-light); border-color: var(--purple); color: #4338CA; }

/* Table Styles */
.slide-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(15,31,56,0.04);
  font-size: clamp(15px, 1.2vw, 18.5px);
  margin-top: 14px;
  border: 1px solid var(--border);
}

.slide-table th {
  background: var(--bg-subtle);
  color: var(--ink);
  font-weight: 700;
  text-align: left;
  padding: clamp(12px, 1.5vh, 18px) clamp(16px, 1.5vw, 22px);
  border-bottom: 2px solid var(--border);
  font-size: clamp(14px, 1.15vw, 17px);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.slide-table td {
  padding: clamp(12px, 1.4vh, 18px) clamp(16px, 1.5vw, 22px);
  border-bottom: 1px solid var(--border-soft);
  color: var(--ink-soft);
  line-height: 1.6;
}

.slide-table tr:last-child td {
  border-bottom: none;
}

.slide-table tr:hover td {
  background: rgba(30, 90, 168, 0.03);
}

/* Quiz Styles */
.quiz-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}

.quiz-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(18px, 2vh, 26px) clamp(20px, 2vw, 28px);
  box-shadow: 0 3px 10px rgba(15,31,56,0.03);
}

.quiz-q {
  font-size: clamp(17px, 1.35vw, 22px);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 14px;
  line-height: 1.4;
}

.quiz-opt {
  display: block;
  padding: 12px 18px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-soft);
  font-size: clamp(15px, 1.2vw, 18.5px);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.quiz-opt:hover {
  background: var(--primary-light);
  border-color: var(--primary);
}

.quiz-opt.correct {
  background: var(--accent-light) !important;
  border-color: var(--accent) !important;
  color: #075E54 !important;
  font-weight: 700;
}

.quiz-opt.incorrect {
  background: var(--danger-light) !important;
  border-color: var(--danger) !important;
  color: #7B341E !important;
  text-decoration: line-through;
}

.quiz-explain {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  font-size: clamp(14px, 1.15vw, 17.5px);
  color: #075E54;
  line-height: 1.55;
  display: none;
}

/* Modal TOC */
#tocModal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15,31,56,0.45);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  justify-content: flex-start;
}

#tocModal.open {
  display: flex;
}

#tocDrawer {
  width: 480px;
  max-width: 90vw;
  height: 100vh;
  background: var(--bg);
  box-shadow: 6px 0 28px rgba(15,31,56,0.18);
  display: flex;
  flex-direction: column;
  animation: slideIn 0.2s ease-out;
}

@keyframes slideIn {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

#tocHeader {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#tocList {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.toc-item {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: all 0.15s ease;
}

.toc-item:hover {

  border-color: rgba(30,90,168,0.25);
}

.toc-item-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
}

.toc-item-sub {

}

.tag {
  display: inline-flex;

  font-size: 12px;
  font-weight: 700;
}

.tag-emerald { background: var(--accent-light); color: var(--accent); }
.tag-blue { background: var(--primary-light); color: var(--primary); }
.tag-amber { background: var(--amber-light); color: var(--amber); }

/* Cover Layout */
.cover-layout {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: calc(100vh - 200px);
}
.cover-layout h1 {
  font-family: var(--font-display);
  font-size: clamp(38px, 5vw, 76px);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 18px;
  line-height: 1.12;
}
</style>

    "left": "\n      <h3 style=\"color:#1F6F64;display:flex;align-items:center;gap:8px;\">\n        <span style=\"background:#E8F5F1;color:#1F6F64;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;\">1</span>\n        Hücreye Giriş ve Glukokinaz\n      </h3>\n      <p style=\"margin-top:8px;\">Kanda glukoz yükseldiğinde, $\\beta$-hücresine <b>GLUT2</b> taşıyıcısı ile glukoz girişi artar.</p>\n      <div class=\"card\" style=\"margin-top:10px;border-left:4px solid #1F6F64;background:#F6FBF9;\">\n        <b>İlk Basamak (Glukokinaz):</b>\n        <p style=\"font-size:13px;margin-top:4px;color:#2B3B36;\">\n          Glukokinaz enzimi 1 ATP kullanarak glukozu <i>Glukoz-6-Fosfata (G6P)</i> fosforiller ve molekülü hücre içine hapseder.\n        </p>\n      </div>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #1F6F64;background:#F6FBF9;\">\n        <b>Glikoliz & TCA Döngüsü (Mitokondri):</b>\n        <p style=\"font-size:13px;margin-top:4px;color:#2B3B36;\">\n          G6P hızla glikoliz ve mitokondriyal solunuma (Krebs + ETS) girer $\\rightarrow$ <b>1 glukoz molekülünden net ~30–32 ATP üretilir.</b>\n        </p>\n      </div>\n    ",

    "left": "\n      <h3 style=\"color:#1F6F64;\">Matematiksel Modeller</h3>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #1F6F64;background:#F6FBF9;\">\n        <b style=\"color:#1F6F64;\">1. HOMA-IR:</b> [Açlık Glukoz (mg/dL) × Açlık İnsülin (µU/mL)] / 405<br>\n        <span style=\"font-size:12px;color:#555;\">> 2.5 belirgin direnç lehinedir.</span>\n      </div>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #2A6F97;background:#EDF6FA;\">\n        <b style=\"color:#2A6F97;\">2. QUICKI:</b> 1 / [log(Açlık Glukoz) + log(Açlık İnsülin)]<br>\n        <span style=\"font-size:12px;color:#555;\">< 0.33 insülin duyarlılığında azalmayı gösterir.</span>\n      </div>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #C78838;background:#FDFBF7;\">\n        <b style=\"color:#C78838;\">3. TyG İndeksi:</b> ln[Açlık TG (mg/dL) × Açlık Glukoz (mg/dL) / 2]<br>\n        <span style=\"font-size:12px;color:#555;\">> 8.5 yüksek metabolik risk.</span>\n      </div>\n    ",
    "right": "\n      <h3 style=\"color:#C84B31;\">Diyetisyenler İçin Kılavuz Uyarısı (ADA/AACE)</h3>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #C84B31;background:#FFF6F4;\">\n        <b>Rutin Açlık İnsülini İstenmeli mi?</b>\n        <p style=\"font-size:12.5px;margin-top:4px;color:#333;\">\n          ADA rutin poliklinikte HOMA-IR veya insülin ölçümünü <b>önermez</b>. Nedenleri: Standardizasyon zayıflığı, pulsatil salınım ve diyet tedavisini değiştirmemesi.\n        </p>\n      </div>\n      <div class=\"box box-emerald\" style=\"margin-top:10px;font-size:13px;\">\n        <b>Pratik Klinik İndikatör: Trigliserit / HDL Oranı:</b><br>\n        Rutin biyokimyada <b>$\text{TG} / \text{HDL} > 3.0$</b> olması, ek maliyet olmadan insülin direncini ve aterojenik riski gösteren en güçlü klinik belirteçlerdendir.\n      </div>\n    ",

    "left": "\n      <h3 style=\"color:#1F6F64;\">Kimyasal Süreç: Maillard Reaksiyonu</h3>\n      <p style=\"margin-top:6px;\">Kanda yüksek glukoz konsantrasyonu varlığında, glukozun serbest aldehit grubu hemoglobinin amino gruplarıyla enzimsiz olarak birleşir.</p>\n      <div class=\"card\" style=\"margin-top:10px;border-left:4px solid #1F6F64;background:#F6FBF9;\">\n        <b>1. Schiff Bazı (Erken Dönem):</b> Hızlıca oluşur ve glukoz seviyesi düşerse geri dönebilir.\n      </div>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #1F6F64;background:#F6FBF9;\">\n        <b>2. Amadori Ürünü (Kararlı HbA1c):</b> Molekül içi düzenlenme ile geri dönüşümsüz kararlı ketoamin yapısına dönüşür $\\rightarrow$ <b>HbA1c (120 günlük hafıza)</b>.\n      </div>\n    ",
    "right": "\n      <h3 style=\"color:#C78838;\">HbA1c İllüzyonu & Glisemik Değişkenlik</h3>\n      <div class=\"card\" style=\"margin-top:10px;border-left:4px solid #C78838;background:#FDFBF7;\">\n        <b>HbA1c %6.2 Çıkan Hasta Güvende midir?</b>\n        <p style=\"font-size:13px;margin-top:4px;color:#333;\">\n          Hasta gün içinde 50 mg/dL'ye inip 350 mg/dL'ye fırlıyorsa ortalama normal çıkabilir. Ancak o 350 mg/dL'lik anlık pikler <b>Aldoz Redüktazı (Poliol) ve Maillard reaksiyonunu maksimuma uyararak doku hasarı yaratır!</b>\n        </p>\n      </div>\n      <div class=\"box box-amber\" style=\"margin-top:10px;font-size:13px;\">\n        <b>Diyetisyenin Temel Amacı:</b> Sadece ortalama HbA1c'yi değil, glisemik dalgalanmaları (rollercoaster) kırarak stabil bir glisemi eğrisi oluşturmaktır.\n      </div>\n    ",

    "left": "\n      <h3 style=\"color:#C84B31;\">AGE-RAGE Vasküler İnflamasyon Yolağı</h3>\n      <p style=\"margin-top:6px;\">Amadori ürünleri zamanla ileri oksidatif reaksiyonlarla <b>İleri Glikasyon Son Ürünlerine (AGEs)</b> dönüşür.</p>\n      <div class=\"card\" style=\"margin-top:10px;border-left:4px solid #C84B31;background:#FFF6F4;\">\n        <b>RAGE Reseptör Aktivasyonu:</b> AGE molekülleri damar endotelindeki RAGE reseptörlerine bağlanarak <b>NF-κB inflamatuar yolağını</b> uyarır $\\rightarrow$ Endotel disfonksiyonu, arteriyel sertlik ve ateroskleroz süreci hızlanır.\n      </div>\n      <div class=\"card\" style=\"margin-top:8px;border-left:4px solid #C84B31;background:#FFF6F4;\">\n        <b>Nefropatide dAGE Riski:</b> Tüketilen dAGE'lerin %10-30'u emilir; böbrek filtrasyonu azalan nefropatili hastalarda dAGE kısıtlaması hayati düzeyde zorunludur!\n      </div>\n    ",

function renderTreeNav(nav) {
  if (!nav || !nav.nodes || !nav.nodes.length) return "";
  let html = `<div class="tree-nav-bar">`;
  if (nav.label) {
    html += `<span class="tree-label">🌲 ${esc(nav.label)}</span>`;
  }
  nav.nodes.forEach((node, idx) => {
    if (idx > 0) {
      html += `<span class="tree-sep">›</span>`;
    }
    const statusClass = node.status ? node.status : "pending";
    const icon = node.icon ? node.icon : "";
    html += `<span class="tree-node ${statusClass}"><span>${icon}</span> <span>${esc(node.title)}</span></span>`;
  });
  html += `</div>`;
  return html;
}

function handleQuizChoice(qIdx, optIdx, isCorrect, btn) {
  const card = btn.closest('.quiz-card');
  if (!card) return;
  const options = card.querySelectorAll('.quiz-opt');
  options.forEach(o => {
    o.style.pointerEvents = 'none';
  });
  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('incorrect');
    const correctBtn = card.querySelector(`[data-correct="true"]`);
    if (correctBtn) correctBtn.classList.add('correct');
  }
  const explain = card.querySelector('.quiz-explain');
  if (explain) explain.style.display = 'block';
}

function openImageModal(src) {
  const modal = document.getElementById('imgZoomModal');
  const target = document.getElementById('imgZoomTarget');
  if (modal && target) {
    target.src = src;
    modal.style.display = 'flex';
  }
}

function closeImageModal() {
  const modal = document.getElementById('imgZoomModal');
  if (modal) modal.style.display = 'none';
}

let current = 0;
const stage = document.getElementById('stage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const fullBtn = document.getElementById('fullBtn');
const secProgress = document.getElementById('secProgress');
const secBar = document.getElementById('sec-bar') || document.getElementById('secBar');

function go(index) {
  if (index < 0) index = 0;
  if (index >= SLIDES.length) index = SLIDES.length - 1;
  current = index;
  const slide = SLIDES[current];
  stage.innerHTML = renderSlide(slide, current);
  stage.scrollTop = 0;

  // MathJax re-render
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([stage]).catch(() => {});
  }

  // Update progress
  const sec = slide.sec !== undefined ? slide.sec : slide.ch;
  const secObj = TOC_SECTIONS.find(ts => parseInt(ts.num) === parseInt(sec)) || { num: sec || "00", title: "Bölüm" };
  secProgress.textContent = `Slayt ${current + 1} / ${SLIDES.length} · BÖLÜM ${secObj.num}: ${secObj.title}`;
  
  if (secBar) {
    const pct = ((current + 1) / SLIDES.length) * 100;
    secBar.style.width = pct + '%';
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
}

function jumpToSec(secIndex) {
  let target = 0;
  for (let i = 0; i < secIndex; i++) {
    target += TOC_SECTIONS[i].count;
  }
  closeToc();
  go(target);
}

prevBtn.addEventListener('click', () => go(current - 1));
nextBtn.addEventListener('click', () => go(current + 1));

if (fullBtn) {
  fullBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
}

// Keyboard shortcuts with vertical scroll priority
window.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const isScrollable = stage && (stage.scrollHeight > stage.clientHeight + 20);

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    go(current + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    go(current - 1);
  } else if (e.key === 'ArrowDown') {
    if (stage && isScrollable) {
      stage.scrollBy({ top: 140, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if (e.key === 'ArrowUp') {
    if (stage && isScrollable) {
      stage.scrollBy({ top: -140, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if (e.key === 'PageDown' || e.key === ' ') {
    if (stage && isScrollable) {
      const atBottom = stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 25;
      if (!atBottom) {
        stage.scrollBy({ top: window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current + 1);
  } else if (e.key === 'PageUp') {
    if (stage && isScrollable) {
      const atTop = stage.scrollTop <= 15;
      if (!atTop) {
        stage.scrollBy({ top: -window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current - 1);
  } else if (e.key === 'Escape') {
    closeToc();
    closeImageModal();
  }
});

// Smart Wheel & Touchpad Navigation
let isWheelLocked = false;
let wheelCooldownTimer = null;
let wheelAccumulatorY = 0;
let wheelAccumulatorX = 0;
let wheelResetTimer = null;

window.addEventListener('wheel', (e) => {
  if (document.getElementById('tocModal')?.classList.contains('open')) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

  clearTimeout(wheelResetTimer);
  wheelResetTimer = setTimeout(() => {
    wheelAccumulatorX = 0;
    wheelAccumulatorY = 0;
  }, 250);

  // Horizontal swipe / trackpad gesture (deltaX)
  if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.5) {
    if (isWheelLocked) return;
    wheelAccumulatorX += e.deltaX;
    if (wheelAccumulatorX > 65) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current + 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 600);
    } else if (wheelAccumulatorX < -65) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current - 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 600);
    }
    return;
  }

  // Vertical scroll / trackpad gestures (deltaY): Sadece sahneyi kaydırır, asla slayt atlamaz
  if (stage && Math.abs(e.deltaY) > 0) {
    stage.scrollBy({ top: e.deltaY, behavior: 'auto' });
  }
}, { passive: true });

// TOC Drawer Controls
const tocBtn = document.getElementById('tocBtn');
const closeTocBtn = document.getElementById('closeTocBtn');
const tocModal = document.getElementById('tocModal');
const tocList = document.getElementById('tocList');

function openToc() {
  let html = "";
  let currentSec = null;
  SLIDES.forEach((s, idx) => {
    const secNum = s.sec !== undefined ? s.sec : s.ch;
    const secObj = TOC_SECTIONS.find(ts => parseInt(ts.num) === parseInt(secNum));
    const secHeading = secObj ? `BÖLÜM ${secObj.num}: ${secObj.title}` : (s.type === 'cover' ? 'GİRİŞ & KAPAK' : `BÖLÜM ${secNum || '00'}`);
    
    if (secHeading !== currentSec) {
      currentSec = secHeading;
      html += `<div style="font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; margin:16px 0 6px; padding:5px 10px; background:rgba(26,115,232,0.08); border-radius:6px; letter-spacing:0.04em;">${esc(currentSec)}</div>`;
    }

    const isActive = current === idx;
    const slideTitle = s.title || s.chTitle || s.text || (s.type === 'cover' ? 'Kapak Slaytı' : `Slayt ${idx + 1}`);
    const eyebrow = s.eyebrow || s.tag || s.badge || '';
    
    html += `
      <div class="toc-item ${isActive ? 'active' : ''}" style="${isActive ? 'border-left:4px solid var(--primary); background:var(--primary-light);' : ''}" onclick="go(${idx}); closeToc();">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div class="toc-item-title" style="font-size:12.5px; font-weight:${isActive ? '700' : '600'}; color:var(--ink); line-height:1.35;">${idx + 1}. ${esc(slideTitle)}</div>
          <span class="tag ${isActive ? 'tag-blue' : 'tag-emerald'}" style="font-size:9.5px; flex-shrink:0;">${s.type || 'slayt'}</span>
        </div>
        ${eyebrow ? `<div class="toc-item-sub" style="font-size:10.5px; color:var(--ink-faint); margin-top:2px;">${esc(eyebrow)}</div>` : ''}
      </div>
    `;
  });
  tocList.innerHTML = html;
  tocModal.classList.add('open');
  setTimeout(() => {
    const activeEl = tocList.querySelector('.toc-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function closeToc() {
  tocModal.classList.remove('open');
}

if (tocBtn) tocBtn.addEventListener('click', openToc);
if (closeTocBtn) closeTocBtn.addEventListener('click', closeToc);
if (tocModal) {
  tocModal.addEventListener('click', e => {
    if (e.target === tocModal) closeToc();
  });
}

// Initial render
go(0);
</script>
