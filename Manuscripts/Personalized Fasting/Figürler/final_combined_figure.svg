<svg width="1000" height="880" viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="880" fill="#FFFFFF"/>

  <!-- ============ ZONE A: INPUTS ============ -->
  <rect x="20" y="20" width="960" height="150" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F172A">A   Inputs</text>

  <rect x="140" y="65" width="280" height="90" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="280" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Protocol Heterogeneity</text>
  <text x="280" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Dose · Timing · Composition · Duration</text>
  <circle cx="400" cy="80" r="10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="80" x2="400" y2="73" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="400" y1="80" x2="405" y2="80" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="580" y="65" width="280" height="90" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="720" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Baseline Phenotype</text>
  <text x="720" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Age · Sex · Genotype · Baseline state</text>
  <text x="720" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#166534">+ Gut microbiota (modifiable)</text>
  <circle cx="840" cy="78" r="4" fill="#475569"/>
  <path d="M831,94 Q840,82 849,94" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arrows: inputs -> conditions -->
  <line x1="280" y1="155" x2="350" y2="241" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead6)"/>
  <line x1="720" y1="155" x2="650" y2="241" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead6)"/>

  <!-- ============ ZONE B: FOUR CONDITIONS (single row, equal peers) ============ -->
  <rect x="20" y="190" width="960" height="185" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="40" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F172A">B   Four Conditions — Simultaneous</text>

  <!-- Threshold Conditions (teal) -->
  <rect x="55" y="245" width="200" height="110" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="155" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Threshold</text>
  <text x="155" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Conditions</text>
  <text x="155" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#134E4A">Dose/intensity cutoff</text>
  <path d="M228,258 A10,10 0 0,1 248,258" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="238" y1="258" x2="244" y2="250" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round"/>

  <text x="270" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#64748B">+</text>

  <!-- Binary Gates (violet) -->
  <rect x="285" y="245" width="200" height="110" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="385" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Binary Gates</text>
  <text x="385" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4C1D95">Component present or absent</text>
  <rect x="463" y="253" width="12" height="10" rx="2" fill="none" stroke="#6D28D9" stroke-width="1.5"/>
  <path d="M465,253 v-4 a4,4 0 0,1 8,0 v4" fill="none" stroke="#6D28D9" stroke-width="1.5"/>

  <text x="500" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#64748B">+</text>

  <!-- Directional Modulators (rose) -->
  <rect x="515" y="245" width="200" height="110" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="615" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9F1239">Directional</text>
  <text x="615" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9F1239">Modulators</text>
  <text x="615" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#881337">Same signal, flips outcome</text>
  <line x1="692" y1="255" x2="704" y2="255" stroke="#BE123C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M696,251 L692,255 L696,259" fill="none" stroke="#BE123C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="692" y1="263" x2="704" y2="263" stroke="#BE123C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M700,259 L704,263 L700,267" fill="none" stroke="#BE123C" stroke-width="1.5" stroke-linecap="round"/>

  <text x="730" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#64748B">+</text>

  <!-- Temporal Window (amber) -->
  <rect x="745" y="245" width="200" height="110" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="845" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#92400E">Temporal Window</text>
  <text x="845" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#78350F">Cellular change lags in time</text>
  <path d="M922,250 h12 l-6,6 z" fill="#B45309"/>
  <path d="M922,266 h12 l-6,-6 z" fill="#B45309"/>
  <line x1="922" y1="250" x2="922" y2="266" stroke="#B45309" stroke-width="1"/>
  <line x1="934" y1="250" x2="934" y2="266" stroke="#B45309" stroke-width="1"/>

  <!-- Arrow: conditions -> outcome -->
  <line x1="500" y1="375" x2="500" y2="393" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead6)"/>

  <!-- ============ ZONE C: OUTCOME (contingency-table grid) ============ -->
  <rect x="20" y="395" width="960" height="420" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="40" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F172A">C   Outcome</text>

  <!-- Corner cell -->
  <rect x="65" y="445" width="110" height="70" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="120" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748B" font-style="italic">Outcome</text>
  <line x1="100" y1="458" x2="140" y2="458" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="120" y1="452" x2="120" y2="458" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="100" cy="463" r="4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="140" cy="463" r="4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Column headers -->
  <rect x="175" y="445" width="380" height="70" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="365" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#334155">Cellular Change: Yes</text>
  <text x="365" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748B">(depot-specific)</text>
  <circle cx="535" cy="462" r="7" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="535" cy="462" r="2" fill="#334155"/>

  <rect x="555" y="445" width="380" height="70" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="745" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#334155">Cellular Change: No</text>
  <text x="745" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748B">(depot-specific)</text>
  <circle cx="915" cy="462" r="7" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="910" y1="457" x2="920" y2="467" stroke="#334155" stroke-width="1.5"/>

  <!-- Row headers -->
  <rect x="65" y="515" width="110" height="140" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="120" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#334155" transform="rotate(-90 120 585)">Weight Change: Yes</text>

  <rect x="65" y="655" width="110" height="140" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="120" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#334155" transform="rotate(-90 120 725)">Weight Change: No</text>

  <!-- Q1: True Repair (green) -->
  <rect x="175" y="515" width="380" height="140" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="365" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14532D">True Repair</text>
  <text x="365" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#166534">Weight loss and cellular remodeling align</text>

  <!-- Q2: Misleading Success (amber) -->
  <rect x="555" y="515" width="380" height="140" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="745" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#92400E">Misleading Success</text>
  <text x="745" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#78350F">Weight drops, tissue unchanged</text>

  <!-- Q3: Hidden Repair (blue) -->
  <rect x="175" y="655" width="380" height="140" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="365" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">Hidden Repair</text>
  <text x="365" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E40AF">Tissue remodels, weight unchanged</text>

  <!-- Q4: No Response (red) -->
  <rect x="555" y="655" width="380" height="140" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="745" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7F1D1D">No Response at Any Level</text>
  <text x="745" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#991B1B">Neither weight nor tissue changes</text>

  <!-- Minimal symbol legend -->
  <text x="40" y="850" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748B">"+" = conditions required simultaneously (AND logic)</text>
</svg>
