<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diyetler İşe Yaramıyor mu? — BES339</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B2320;
    --bg-deep:#1C1613;
    --bg-raise:#382E29;
    --accent:#B5563A;
    --accent-dark:#8B3F2A;
    --accent-deep:#5E2A1D;
    --cream:#F6F1E7;
    --tan:#EDE4D3;
    --tan-mute:#DDD3C4;
    --muted:#5C5248;
    --green:#4F6B52;
    --green-light:#7A9278;
    --white:#FFFFFF;
    --black:#000000;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg-deep); overflow:hidden;}
  body{
    font-family:var(--sans);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:safe center;
    padding:7vh 9vw;
    opacity:0;
    transform:translateY(24px);
    pointer-events:none;
    overflow-y:auto;
    overflow-x:hidden;
    max-height:100vh;
    box-sizing:border-box;
    transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
  }
  .slide.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .slide.leaving{
    opacity:0;
    transform:translateY(-24px);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:var(--accent);
    display:inline-block;
  }
  h1,h2,h3{ font-family:var(--serif); font-weight:450; line-height:1.05; color:var(--cream);}
  .slide-title{ font-size:clamp(28px,3.4vw,50px); font-weight:500; margin-bottom:.5em; max-width:16ch;}
  .slide-sub{ font-family:var(--sans); font-size:clamp(14px,1.15vw,17px); color:var(--tan-mute); max-width:56ch; line-height:1.55; font-weight:400;}
  .num-badge{
    position:absolute; bottom:6vh; right:9vw;
    font-family:var(--mono); font-size:13px; color:var(--muted);
  }

  /* ===== COVER ===== */
  .cover{ justify-content:center; align-items:flex-start;}
  .cover .kicker{ font-family:var(--mono); font-size:13px; letter-spacing:.12em; color:var(--tan-mute); margin-bottom:26px; text-transform:uppercase;}
  .cover h1{ font-size:clamp(44px,7vw,96px); font-weight:450; max-width:14ch; margin-bottom:22px;}
  .cover .sub{ font-family:var(--sans); font-size:clamp(15px,1.3vw,19px); color:var(--tan-mute); max-width:44ch; line-height:1.6; margin-bottom:40px;}
  .cover .byline{ font-family:var(--mono); font-size:12.5px; color:var(--accent);}
  .cover .orb{
    position:absolute; top:-10vh; right:-8vw; width:44vw; height:44vw; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--accent-dark), transparent 70%);
    opacity:.5; filter:blur(2px);
  }

  /* ===== ACT DIVIDER ===== */
  .act-slide{ align-items:flex-start; justify-content:center; background:radial-gradient(ellipse at 20% 50%, var(--bg-raise), var(--bg-deep) 70%);}
  .act-num{ font-family:var(--serif); font-style:italic; font-size:clamp(90px,13vw,190px); color:var(--accent-deep); line-height:.8; margin-bottom:6px; -webkit-text-stroke:1px var(--accent);}
  .act-label{ font-family:var(--mono); font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:18px;}
  .act-title{ font-size:clamp(34px,5vw,64px); font-weight:500; max-width:16ch; margin-bottom:16px;}
  .act-sub{ font-family:var(--serif); font-style:italic; font-size:clamp(16px,1.5vw,22px); color:var(--tan-mute); max-width:40ch;}
  .curtain{ position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:linear-gradient(90deg, var(--bg-deep) 0%, transparent 12%, transparent 88%, var(--bg-deep) 100%);}

  /* ===== body content grid ===== */
  .content-body{ display:flex; flex-direction:column; gap:26px; max-width:1400px;}
  .grid{ display:grid; gap:18px;}
  .g2{ grid-template-columns:1fr 1fr;}
  .g3{ grid-template-columns:repeat(3,1fr);}
  .g4{ grid-template-columns:repeat(4,1fr);}
  .card{
    background:var(--bg-raise);
    border:1px solid rgba(246,241,231,0.08);
    border-radius:4px;
    padding:22px 24px;
  }
  .card.on-cream{ background:var(--tan); color:var(--bg-deep);}
  .card.on-cream .card-h{ color:var(--accent-deep);}
  .card.accent{ background:var(--accent-dark); color:var(--cream);}
  .card.green{ background:var(--green); color:var(--cream);}
  .card-h{ font-family:var(--sans); font-weight:600; font-size:15px; color:var(--accent); margin-bottom:8px;}
  .card-body{ font-size:14.5px; line-height:1.55; color:var(--tan-mute);}
  .card.on-cream .card-body{ color:var(--muted);}
  .card.accent .card-body, .card.green .card-body{ color:var(--tan);}

  /* stat */
  .stat-num{ font-family:var(--serif); font-size:clamp(40px,5vw,72px); font-weight:500; color:var(--accent); line-height:1;}
  .stat-label{ font-size:13.5px; color:var(--tan-mute); margin-top:8px; line-height:1.4;}

  /* quote */
  .quote-slide blockquote{ font-family:var(--serif); font-style:italic; font-size:clamp(22px,2.6vw,38px); line-height:1.35; color:var(--cream); max-width:22ch; margin-bottom:26px;}
  .quote-cite{ font-family:var(--mono); font-size:12.5px; color:var(--accent);}
  .quote-note{ margin-top:20px; font-size:14.5px; color:var(--tan-mute); max-width:50ch;}

  /* cycle diagram */
  .cycle-wrap{ position:relative; width:min(560px,60vh); height:min(560px,60vh); margin:0 auto;}
  .cycle-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:118px; height:118px; border-radius:50%; background:var(--accent-deep); border:1px solid var(--accent); display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; padding:10px;}
  .cycle-item{ position:absolute; width:190px; padding:14px 16px; background:var(--bg-raise); border:1px solid rgba(246,241,231,.1); border-radius:4px; font-size:13px; line-height:1.4; color:var(--tan-mute);}

  /* choice two (spoiler) */
  .choice-list{ display:flex; flex-direction:column; gap:14px; max-width:640px;}
  .choice-item{ padding:16px 20px; border-radius:4px; font-family:var(--serif); font-style:italic; font-size:clamp(16px,1.6vw,21px);}
  .choice-item.pos{ background:var(--green);}
  .choice-item.neg{ background:var(--accent-dark);}
  .choice-item.neutral{ background:var(--tan); color:var(--bg-deep); font-style:normal; font-family:var(--sans); font-weight:600;}

  /* process numbered */
  .proc-row{ display:flex; flex-direction:column; gap:10px; max-width:900px;}
  .proc-step{ display:flex; gap:18px; align-items:flex-start; padding:12px 0; border-bottom:1px solid rgba(246,241,231,.08);}
  .proc-step:last-child{ border-bottom:none;}
  .proc-idx{ font-family:var(--serif); font-style:italic; font-size:26px; color:var(--accent); width:38px; flex-shrink:0;}
  .proc-text{ font-size:14.5px; line-height:1.5; color:var(--tan-mute); padding-top:4px;}

  /* table */
  table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; max-width:1100px;}
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); padding:10px 14px; border-bottom:1px solid var(--accent-dark);}
  table.data-table td{ padding:10px 14px; border-bottom:1px solid rgba(246,241,231,.08); color:var(--tan-mute); line-height:1.4;}
  table.data-table tr:hover td{ background:rgba(181,86,58,.08);}

  /* case story */
  .case-slide{ background:radial-gradient(ellipse at 80% 20%, var(--bg-raise), var(--bg-deep) 65%);}
  .case-name{ font-family:var(--serif); font-size:clamp(30px,4vw,52px); font-weight:500; margin-bottom:20px;}
  .case-monologue{ font-family:var(--serif); font-style:italic; font-size:clamp(16px,1.5vw,21px); line-height:1.7; max-width:52ch; color:var(--tan-mute);}
  .case-tag{ font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}

  .case-line{ font-family:var(--serif); font-style:italic; font-size:clamp(20px,2.2vw,32px); line-height:1.4; max-width:26ch; color:var(--cream);}

  /* synth list */
  .synth-list{ list-style:none; display:flex; flex-direction:column; gap:12px; max-width:820px;}
  .synth-list li{ font-size:15.5px; line-height:1.55; color:var(--tan-mute); padding-left:26px; position:relative;}
  .synth-list li::before{ content:'—'; position:absolute; left:0; color:var(--accent);}

  /* icon grid simple dot */
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block; margin-bottom:10px;}

  /* concept icons + avatars */
  .icon-wrap{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:rgba(181,86,58,.14); color:var(--accent); flex-shrink:0;}
  .card.on-cream .icon-wrap{ background:rgba(139,63,42,.12); color:var(--accent-deep);}
  .icon-wrap svg{ width:19px; height:19px;}
  .avatar-circle{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:24px; font-weight:500; color:var(--cream); margin-bottom:18px; border:1px solid rgba(246,241,231,.25);}

  /* NAV */
  #nav{
    position:fixed; bottom:0; left:0; right:0; height:64px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; z-index:50;
    background:linear-gradient(0deg, var(--bg-deep) 40%, transparent);
  }
  .nav-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid rgba(246,241,231,.2);
    background:transparent; color:var(--cream); cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, border-color .2s;
  }
  .nav-btn:hover{ background:var(--accent-dark); border-color:var(--accent-dark);}
  .nav-btn:disabled{ opacity:.25; cursor:default; background:none; border-color:rgba(246,241,231,.2);}
  #progress-track{ flex:1; height:2px; background:rgba(246,241,231,.12); margin:0 22px; position:relative; border-radius:2px; overflow:hidden;}
  #progress-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); width:0%; transition:width .4s;}
  #act-indicator{ font-family:var(--mono); font-size:11.5px; color:var(--tan-mute); letter-spacing:.06em; white-space:nowrap;}
  #slide-counter{ font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap; margin-left:18px;}

  #act-rail{
    position:fixed; top:0; right:0; height:100vh; width:5px;
    display:flex; flex-direction:column; z-index:40;
  }
  .rail-seg{ flex:1; background:rgba(246,241,231,.08); margin-bottom:1px; transition:background .3s;}
  .rail-seg.done{ background:var(--accent);}

  @media (max-width:760px){
    .g2,.g3,.g4{ grid-template-columns:1fr;}
    .slide{ padding:9vh 6vw 12vh;}
    .cycle-wrap{ display:none;}
  }
  ::selection{ background:var(--accent); color:var(--cream);}

  /* ===== PRINT MODE — açık zemin, koyu metin, slaytlar alt alta akar ===== */
  @media print{
    :root{
      --bg:#FFFFFF; --bg-deep:#FFFFFF; --bg-raise:#F6F1E7;
      --accent:#8B3F2A; --accent-dark:#8B3F2A; --accent-deep:#5E2A1D;
      --cream:#211A16; --tan:#FFFFFF; --tan-mute:#3A2F29; --muted:#6B6058;
      --green:#3F5541; --green-light:#3F5541;
    }
    #nav, #act-rail{ display:none !important;}
    html,body{ overflow:visible !important; background:#fff !important;}
    #stage{ position:static; width:auto; height:auto; overflow:visible;}
    .slide{
      position:static !important; opacity:1 !important; transform:none !important;
      pointer-events:auto !important; display:flex !important;
      min-height:auto; padding:26px 6px 34px; page-break-after:always; break-after:page;
      border-bottom:1px solid #ddd;
    }
    .cover, .act-slide, .case-slide{ min-height:90vh;}
    .cycle-wrap{ height:560px;}
    .curtain, .orb{ display:none !important;}
    .card, table.data-table{ border:1px solid #ccc !important;}
    .card.accent, .card.green{ border:1px solid #999 !important;}
  }

  /* Top Bar & Sec Rail */
  #topBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(28, 22, 19, 0.96);
    backdrop-filter: blur(10px);
    z-index: 100;
    border-bottom: 1px solid rgba(237, 228, 211, 0.08);
  }
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing: -0.01em;
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(181, 86, 58, 0.3);
  }
  #sec-rail {
    position: fixed;
    top: 50px;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(237, 228, 211, 0.06);
    z-index: 95;
    display: block;
    width: 100vw;
  }
  #sec-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green-light));
    width: 0%;
    transition: width 0.25s ease;
  }
  #stage {
    margin-top: 52px;
  }
  /* TOC Drawer */
  #tocModal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    justify-content: flex-start;
  }
  #tocModal.open {
    display: flex;
  }
  #tocDrawer {
    width: 440px;
    max-width: 90vw;
    height: 100vh;
    background: var(--bg-deep);
    box-shadow: 4px 0 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    animation: slideInToc 0.2s ease-out;
  }
  @keyframes slideInToc {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }
  #tocHeader {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(237, 228, 211, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #tocList {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }
  .toc-item {
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--bg-raise);
    border: 1px solid rgba(237, 228, 211, 0.06);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toc-item:hover {
    background: rgba(181, 86, 58, 0.15);
    border-color: rgba(181, 86, 58, 0.3);
  }
  .toc-item.active {
    border-left: 4px solid var(--accent);
    background: rgba(181, 86, 58, 0.2);
  }
  .toc-item-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.35;
  }
  .toc-item-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

</style>
</head>
<body>
<div id="topBar">
  <div style="display:flex; align-items:center; gap:14px;">
    <button id="tocBtn" style="padding:6px 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;background:rgba(181,86,58,0.18);border:1px solid rgba(181,86,58,0.4);color:var(--cream);cursor:pointer;border-radius:6px;transition:all 0.15s ease;">
      <span style="font-size:14px;">☰</span> <span>İçindekiler</span>
    </button>
    <div class="brand-badge">
      <div class="brand-dot"></div>
      <span>Diyetler İşe Yaramıyor Mu? · Popüler Diyetler</span>
    </div>
  </div>
  <div id="topBarTopic" style="font-size:12px; font-weight:600; color:var(--tan); font-family:var(--mono); display:flex; align-items:center; gap:8px;">
    <span style="background:rgba(181,86,58,0.25); color:var(--cream); font-weight:700; padding:3px 10px; border-radius:6px;">Giriş</span>
  </div>
</div>
<div id="sec-rail" id="act-rail"><div id="sec-bar"></div></div>

<div id="stage"></div>

<div id="tocModal">
  <div id="tocDrawer">
    <div id="tocHeader">
      <div style="font-weight:700; font-size:14px; color:var(--cream); display:flex; align-items:center; gap:8px;">
        <span>📑</span> <span>İçindekiler & Tüm Slaytlar</span>
      </div>
      <button id="closeTocBtn" style="background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; border-radius:4px; line-height:1;">✕</button>
    </div>
    <div id="tocList"></div>
  </div>
</div>

<div id="nav">
  <button class="nav-btn" id="prevBtn" aria-label="Önceki">←</button>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="act-indicator"></div>
  <div id="slide-counter"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Sonraki">→</button>
</div>

<script>
const ACTS = [
  "Kısır Döngü","Vücut Ağırlığı Kaybının Fizyolojisi","Platoyu Yönetmek",
  "Diyetler Neden Başarısız Olur?","Başarılı Bir Diyet Yok mu?","Vaka Örnekleri","Sonuç"
];

const SLIDES = [
{type:'cover', kicker:'BES339 · Diyet İlkeleri ve Popüler Diyetler', title:'Diyetler İşe\nYaramıyor mu?', sub:'Vücut ağırlığı kaybının fizyolojisi, neden başarısız oluruz, kim başarır — ve gerçek hastalardan üç hikâye.', byline:'Arş. Gör. Dr. Caner Özyıldırım'},

{type:'act', n:'01', act:0, title:'Kısır Döngü', sub:'Diyetler neden istatistiksel olarak çoğu zaman kaybediyor?'},

{type:'choice', act:0, eyebrow:'Açılış', title:'Spoiler Alert', items:[
  {t:'Her diyet başarılı olabilir.', cls:'pos'},
  {t:'Tüm diyetler başarısız olabilir.', cls:'neg'},
  {t:'Başarısızlığın sırrı: sadece kilo kaybına odaklanmak.', cls:'neutral'}
]},

{type:'quote', act:0, eyebrow:'1958 → Bugün', q:'Obeziteyle mücadele edenlerin çoğu tedavide kalmıyor. Kalanların çoğu kilo vermiyor, verenlerin de çoğu geri alıyor.', cite:'Albert Stunkard, The Management of Obesity — NY State J Med, 1958', note:"Bu satırlar 1958'de yazıldı. 65 yıl sonra hâlâ aynı gerçeği tartışıyoruz."},

{type:'chart', act:0, eyebrow:"29 Uzun Dönem Çalışmanın Meta-Analizi", title:'Kaybedilen Kilo, Büyük Oranda Geri Kazanılıyor',
  bars:[{label:'2 yıl', val:50},{label:'5 yıl', val:80}],
  note:'Bariatrik cerrahide de benzer bir eğilim gösteren kanıtlar var — yani durum sadece diyetlere özgü değil.',
  cite:'Anderson ve ark., Am J Clin Nutr. 2001;74(5):579–84. · Hall & Kahan, Med Clin North Am. 2018;102(1):183–97.'},

{type:'cycle', act:0, eyebrow:'Neden Aynı Yere Dönüyoruz?', title:'Kısır Döngü', items:[
  'Hızlı vücut ağırlığı kaybı (Negatif enerji dengesi)',
  'Artmış iştah + Metabolizmada yavaşlama',
  'Ağırlık kazanımı (Muhtemelen daha fazla yağ oranıyla)',
  'Tedavi arayışında azalma',
  'Kilo kaybının beyinde tehdit olarak algılanması',
  'Başarısız kilo kaybı girişimleri',
  'Diyetin boş bir çaba olarak görülmesi',
  'Alternatiflere yöneliş'
]},

{type:'twoq', act:0, eyebrow:'Peki neden?', items:[
  {n:'1', t:'Yanlış diyeti mi seçiyoruz?'},

]},

function renderChart(s){
  const max = Math.max(...s.bars.map(b=>b.val));
  return `<div class="slide">${eyebrowTitle(s)}
  <div style="display:flex; gap:60px; align-items:flex-end; height:220px; margin:20px 0 30px;">
    ${s.bars.map(b=>`<div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="font-family:var(--mono); color:var(--accent); font-size:14px;">${b.val}%</div>
      <div style="width:70px; height:${(b.val/max)*160}px; background:var(--accent-dark); border-radius:3px 3px 0 0;"></div>
      <div style="font-size:13px; color:var(--tan-mute);">${b.label}</div></div>`).join('')}
  </div>
  <div class="slide-sub">${s.note}</div>
  <div class="quote-cite" style="margin-top:14px;">${s.cite}</div></div>`;
}
function renderCycle(s){
  const angleStep = 360/s.items.length;
  const radius = 220;
  let items = s.items.map((t,i)=>{
    const angle = (angleStep*i - 90) * Math.PI/180;
    const x = Math.cos(angle)*radius, y = Math.sin(angle)*radius;
    return `<div class="cycle-item" style="top:calc(50% + ${y}px - 40px); left:calc(50% + ${x}px - 95px);">${t}</div>`;
  }).join('');
  return `<div class="slide">${eyebrowTitle(s)}
  <div class="cycle-wrap">${items}<div class="cycle-center">DÖNGÜ</div></div></div>`;
}

    <div><div class="card-h" style="margin-bottom:12px;">Mekanizma</div>
      <ul class="synth-list">${s.mech.map(m=>`<li>${m}</li>`).join('')}</ul></div>
    <div><div class="card-h" style="margin-bottom:12px; color:var(--green-light);">Müdahale</div>
      <ul class="synth-list" style="--dot:var(--green);">${s.interv.map(m=>`<li style="--c:var(--green);">${m}</li>`).join('')}</ul></div>
  </div></div>`;
}
function renderCaseQuote(s){
  return `<div class="slide case-slide"><div class="case-tag">${s.name} — Danışanla Konuşma</div>
  <div class="case-line">"${s.line}"</div></div>`;
}
function renderCloser(s){
  return `<div class="slide"><h1 style="font-size:clamp(30px,4vw,54px); margin-bottom:30px;">${s.title}</h1>
  <div style="display:flex; flex-direction:column; gap:16px; max-width:60ch;">
  ${s.lines.map((l,i)=>`<div style="font-family:var(--serif); font-size:${i===3?'20px':'16px'}; font-style:${i>=2?'italic':'normal'}; color:${i===0?'var(--accent)':'var(--tan-mute)'}; line-height:1.5;">${l}</div>`).join('')}
  </div></div>`;
}

function renderSlide(s, idx){
  let html='';
  switch(s.type){
    case 'cover': html=renderCover(s); break;
    case 'act': html=renderAct(s); break;
    case 'choice': html=renderChoice(s); break;
    case 'quote': html=renderQuote(s); break;
    case 'chart': html=renderChart(s); break;
    case 'cycle': html=renderCycle(s); break;
    case 'twoq': html=renderTwoQ(s); break;
    case 'icon3': html=renderIcon3(s); break;
    case 'process': html=renderProcess(s); break;
    case 'grid2': html=renderGrid(s, s.grid4?4:2); break;
    case 'grid3': html=renderGrid(s,3); break;
    case 'grid4': html=renderGrid(s,4); break;
    case 'diagram-setpoint': html=renderDiagramSetpoint(s); break;
    case 'table': html=renderTable(s); break;
    case 'statsplit': html=renderStatSplit(s); break;
    case 'grid4stat': html=renderGrid4Stat(s); break;
    case 'synth': html=renderSynth(s); break;
    case 'case-story': html=renderCaseStory(s); break;
    case 'case-backstage': html=renderCaseBackstage(s); break;
    case 'case-quote': html=renderCaseQuote(s); break;
    case 'closer': html=renderCloser(s); break;
    default: html=`<div class="slide"><div>${JSON.stringify(s)}</div></div>`;
  }
  return html;
}

/* ================= APP ================= */
const stage = document.getElementById('stage');
let current = 0;
const total = SLIDES.length;

SLIDES.forEach((s,i)=>{
  const wrap = document.createElement('div');
  wrap.innerHTML = renderSlide(s,i);
  const el = wrap.firstElementChild;
  el.dataset.idx = i;
  stage.appendChild(el);
});

const allSlideEls = Array.from(stage.children);

// build act rail
const rail = document.getElementById('act-rail') || document.getElementById('sec-rail');
const railSegs = [];
if(rail){ allSlideEls.forEach(()=>{ const seg=document.createElement('div'); seg.className='rail-seg'; rail.appendChild(seg); railSegs.push(seg); }); }

function go(idx, dir){
  if(idx<0||idx>=total) return;
  const prevEl = allSlideEls[current];
  const nextEl = allSlideEls[idx];
  if(prevEl) { prevEl.classList.remove('active'); }
  nextEl.classList.add('active');
  current = idx;
  update();
}
function update(){
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===total-1;
  const pct = ((current)/(total-1)*100)+'%';
  document.getElementById('progress-fill').style.width = pct;
  const secBar = document.getElementById('sec-bar');
  if (secBar) secBar.style.width = pct;
  const s = SLIDES[current];
  const actLabel = (s.act!==undefined) ? `PERDE ${['I','II','III','IV','V','VI','VII'][s.act]}: ${ACTS[s.act]}` : (s.type==='cover'?'GİRİŞ & KAPAK':'SONUÇ');
  document.getElementById('act-indicator').textContent = actLabel;
  const topTopic = document.getElementById('topBarTopic');
  if (topTopic) topTopic.innerHTML = `<span style="background:rgba(181,86,58,0.25); color:var(--cream); font-weight:700; padding:3px 10px; border-radius:6px;">${actLabel}</span>`;
  document.getElementById('slide-counter').textContent = (current+1)+' / '+total;
}

// TOC Drawer Controls
const tocBtn = document.getElementById('tocBtn');
const closeTocBtn = document.getElementById('closeTocBtn');
const tocModal = document.getElementById('tocModal');
const tocList = document.getElementById('tocList');

function openToc(){
  let html = "";
  let currentAct = null;
  SLIDES.forEach((s, idx) => {
    const actHeader = (s.act !== undefined) ? `PERDE ${['I','II','III','IV','V','VI','VII'][s.act]}: ${ACTS[s.act]}` : (s.type === 'cover' ? 'GİRİŞ & KAPAK' : 'SONUÇ');
    if (actHeader !== currentAct){
      currentAct = actHeader;
      html += `<div style="font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; margin:16px 0 6px; padding:5px 10px; background:rgba(181,86,58,0.15); border-radius:6px; letter-spacing:0.04em;">${currentAct}</div>`;
    }
    const isActive = current === idx;
    const title = s.title || s.q || s.h || (s.type === 'cover' ? 'Kapak Slaytı' : `Slayt ${idx + 1}`);
    const sub = s.sub || s.kicker || s.eyebrow || '';
    html += `<div class="toc-item ${isActive ? 'active' : ''}" onclick="go(${idx}); closeToc();">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div class="toc-item-title">${idx + 1}. ${title.replace(/<[^>]+>/g, ' ')}</div>
        <span style="font-size:9.5px; background:rgba(181,86,58,0.2); color:var(--cream); padding:2px 6px; border-radius:4px; font-weight:600; flex-shrink:0;">${s.type || 'slayt'}</span>
      </div>
      ${sub ? `<div class="toc-item-sub">${sub.replace(/<[^>]+>/g, ' ')}</div>` : ''}
    </div>`;
  });
  tocList.innerHTML = html;
  tocModal.classList.add('open');
  setTimeout(() => {
    const activeEl = tocList.querySelector('.toc-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function closeToc(){
  tocModal.classList.remove('open');
}

if (tocBtn) tocBtn.addEventListener('click', openToc);
if (closeTocBtn) closeTocBtn.addEventListener('click', closeToc);
if (tocModal) {
  tocModal.addEventListener('click', e => {
    if (e.target === tocModal) closeToc();
  });
}
document.getElementById('nextBtn').addEventListener('click',()=>go(current+1));
document.getElementById('prevBtn').addEventListener('click',()=>go(current-1));
window.addEventListener('keydown', e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const activeSlide = allSlideEls[current];
  const isScrollable = activeSlide && (activeSlide.scrollHeight > activeSlide.clientHeight + 15);

  if(['ArrowRight'].includes(e.key)){ e.preventDefault(); go(current+1); }
  else if(['ArrowLeft'].includes(e.key)){ e.preventDefault(); go(current-1); }
  else if(['ArrowDown'].includes(e.key)){
    if(activeSlide && isScrollable){
      activeSlide.scrollBy({ top: 130, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if(['ArrowUp'].includes(e.key)){
    if(activeSlide && isScrollable){
      activeSlide.scrollBy({ top: -130, behavior: 'smooth' });
      e.preventDefault();
    }
  } else if(['PageDown',' '].includes(e.key)){
    if(activeSlide && isScrollable){
      const atBottom = activeSlide.scrollTop + activeSlide.clientHeight >= activeSlide.scrollHeight - 25;
      if(!atBottom){
        activeSlide.scrollBy({ top: window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current+1);
  } else if(['PageUp'].includes(e.key)){
    if(activeSlide && isScrollable){
      const atTop = activeSlide.scrollTop <= 15;
      if(!atTop){
        activeSlide.scrollBy({ top: -window.innerHeight * 0.75, behavior: 'smooth' });
        e.preventDefault();
        return;
      }
    }
    e.preventDefault();
    go(current-1);
  } else if(e.key==='Escape'){ closeToc(); }
});

// Smart Wheel & Touchpad Navigation
let isWheelLocked = false;
let wheelCooldownTimer = null;
let wheelAccumulatorX = 0;
let wheelResetTimer = null;

window.addEventListener('wheel', (e) => {
  if (document.getElementById('tocModal')?.classList.contains('open')) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

  clearTimeout(wheelResetTimer);
  wheelResetTimer = setTimeout(() => {
    wheelAccumulatorX = 0;
  }, 250);

  // Horizontal swipe / trackpad gesture (deltaX)
  if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.5) {
    if (isWheelLocked) return;
    wheelAccumulatorX += e.deltaX;
    if (wheelAccumulatorX > 60) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current + 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 550);
    } else if (wheelAccumulatorX < -60) {
      isWheelLocked = true;
      wheelAccumulatorX = 0;
      go(current - 1);
      clearTimeout(wheelCooldownTimer);
      wheelCooldownTimer = setTimeout(() => { isWheelLocked = false; }, 550);
    }
    return;
  }

  // Vertical scroll / trackpad gestures (deltaY): Sadece slayt içeriğini kaydırır, asla slayt atlamaz
  const activeSlide = allSlideEls[current];
  if (activeSlide && Math.abs(e.deltaY) > 0) {
    activeSlide.scrollBy({ top: e.deltaY, behavior: 'auto' });
  }
}, { passive: true });

let touchX=null;
window.addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; }, { passive: true });
window.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50){ dx<0 ? go(current+1) : go(current-1); }
  touchX=null;
}, { passive: true });

go(0);
</script>
